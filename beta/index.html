<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nev630 Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: {
              light: '#ffffff',
              dark: '#111827',
            },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased transition-colors duration-200">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
    <!-- Header -->
    <header class="flex items-center justify-between gap-4 mb-6">
      <div class="flex items-center gap-3.5">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 text-white font-bold text-lg flex items-center justify-center shadow-md shadow-indigo-500/20">
          N
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-bold tracking-tight">nev630 Portal</h1>
          <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">GitHub Pages 통합 웹 앱 런처</p>
        </div>
      </div>

      <button
        id="theme-toggle"
        type="button"
        aria-label="테마 전환"
        class="w-10 h-10 rounded-xl bg-surface-light dark:bg-surface-dark border border-slate-200/80 dark:border-slate-800 flex items-center justify-center text-lg hover:border-indigo-400 transition shadow-sm"
      >
        <span id="theme-icon">🌙</span>
      </button>
    </header>

    <!-- Sticky Search & Filter Bar -->
    <section class="sticky top-3 z-20 mb-6 p-3 rounded-2xl bg-white/85 dark:bg-slate-900/85 backdrop-blur-md border border-slate-200/80 dark:border-slate-800/90 shadow-sm space-y-2.5">
      <div class="relative">
        <input
          id="search-input"
          type="search"
          placeholder="앱 이름, 설명, 태그 검색..."
          class="w-full px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-950/70 border border-slate-200/80 dark:border-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition"
        />
      </div>

      <div class="flex items-center justify-between gap-3">
        <div id="category-tabs" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5"></div>
        <div class="text-xs text-slate-500 dark:text-slate-400 shrink-0">
          Apps <span id="app-count" class="font-semibold text-indigo-600 dark:text-indigo-400">0개</span>
        </div>
      </div>
    </section>

    <!-- Bento Grid -->
    <main id="app-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 grid-flow-dense"></main>

    <!-- Empty State -->
    <div id="empty-state" class="hidden py-16 text-center rounded-2xl bg-surface-light dark:bg-surface-dark border border-dashed border-slate-200 dark:border-slate-800">
      <p class="text-sm text-slate-500 dark:text-slate-400">일치하는 앱이 없습니다.</p>
    </div>

    <!-- Footer -->
    <footer class="mt-12 pt-6 border-t border-slate-200/70 dark:border-slate-800/80 flex items-center justify-between text-xs text-slate-400 dark:text-slate-500">
      <span>nev630.github.io</span>
      <span>v0.2.0-beta</span>
    </footer>
  </div>

  <script src="js/apps.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
