<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nev630 Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: {
              light: '#ffffff',
              dark: '#0f172a',
            },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased overflow-x-hidden">
  <!-- Isometric Voxel Wave Background Canvas -->
  <canvas id="voxel-wave-bg" aria-hidden="true" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>

  <div class="relative z-10 max-w-2xl mx-auto px-4 sm:px-6 py-5 sm:py-8">
    <!-- Sticky Voxel Category Filter Bar -->
    <section class="sticky top-3 z-20 mb-7 px-3 py-2 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-2 border-slate-900 dark:border-indigo-400/70 shadow-[4px_4px_0px_0px_rgba(15,23,42,0.9)] dark:shadow-[4px_4px_0px_0px_rgba(99,102,241,0.45)] flex items-center justify-between gap-3">
      <div id="category-tabs" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5"></div>
      <div class="text-xs text-slate-600 dark:text-slate-300 shrink-0">
        APPS <span id="app-count" class="font-bold text-indigo-600 dark:text-indigo-400">0</span>
      </div>
    </section>

    <!-- 2.5D Vertical Scroll App List -->
    <main id="app-list" class="voxel-stage space-y-6 pb-12"></main>

    <!-- Empty State -->
    <div id="empty-state" class="hidden py-16 text-center bg-white dark:bg-slate-900 border-2 border-dashed border-slate-400 dark:border-slate-700 text-sm text-slate-500 dark:text-slate-400">
      NO MATCHING APPS
    </div>
  </div>

  <script src="js/apps.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
