<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>nev630 Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: {
              light: '#ffffff',
              dark: '#0f172a',
            },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased select-none">
  <!-- Fullscreen Three.js Voxel 3D Canvas -->
  <canvas id="portal-3d" class="fixed inset-0 w-full h-full block touch-none"></canvas>

  <!-- Top Voxel Category Filter Bar -->
  <div class="fixed top-3 left-0 right-0 z-20 px-4 pointer-events-none">
    <div class="max-w-3xl mx-auto px-3 py-2 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-2 border-slate-900 dark:border-indigo-400/70 shadow-[4px_4px_0px_0px_rgba(15,23,42,0.9)] dark:shadow-[4px_4px_0px_0px_rgba(99,102,241,0.45)] flex items-center justify-between gap-3 pointer-events-auto">
      <div id="category-tabs" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5"></div>
      <div class="text-xs font-mono text-slate-600 dark:text-slate-300 shrink-0">
        APPS <span id="app-count" class="font-bold text-indigo-600 dark:text-indigo-400">0</span>
      </div>
    </div>
  </div>

  <!-- Bottom Voxel Selected App HUD -->
  <div id="hud-wrapper" class="fixed bottom-5 left-0 right-0 z-20 px-4 pointer-events-none">
    <div class="max-w-xl mx-auto p-4 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-2 border-slate-900 dark:border-indigo-400/70 shadow-[5px_5px_0px_0px_rgba(15,23,42,0.9)] dark:shadow-[5px_5px_0px_0px_rgba(99,102,241,0.45)] pointer-events-auto">
      <div class="flex items-start justify-between gap-3 mb-2">
        <div class="flex items-center gap-3 min-w-0">
          <div id="hud-code" class="w-10 h-10 bg-indigo-600 text-white font-mono font-bold text-xs border-2 border-slate-900 dark:border-indigo-300 flex items-center justify-center shrink-0"></div>
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <span id="hud-category" class="text-[11px] font-mono font-bold uppercase text-indigo-600 dark:text-indigo-400"></span>
              <span id="hud-status" class="inline-flex items-center gap-1 px-1.5 py-0.5 border border-emerald-600/40 bg-emerald-500/10 text-[10px] font-mono font-semibold text-emerald-600 dark:text-emerald-400"></span>
            </div>
            <h2 id="hud-title" class="text-base font-bold truncate"></h2>
          </div>
        </div>

        <button
          id="hud-pin"
          type="button"
          aria-label="즐겨찾기"
          class="w-8 h-8 border-2 border-slate-300 dark:border-slate-700 flex items-center justify-center text-sm font-mono transition shrink-0"
        ></button>
      </div>

      <p id="hud-desc" class="text-xs text-slate-600 dark:text-slate-400 line-clamp-2 mb-3"></p>

      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-1.5">
          <button id="prev-btn" type="button" aria-label="이전 앱" class="w-8 h-8 bg-slate-100 dark:bg-slate-800 border-2 border-slate-900 dark:border-slate-600 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-mono font-bold transition">&lt;</button>
          <span id="hud-index" class="text-xs font-mono font-semibold text-slate-600 dark:text-slate-300 px-1.5">1 / 1</span>
          <button id="next-btn" type="button" aria-label="다음 앱" class="w-8 h-8 bg-slate-100 dark:bg-slate-800 border-2 border-slate-900 dark:border-slate-600 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-mono font-bold transition">&gt;</button>
        </div>

        <div class="flex items-center gap-2">
          <a id="hud-repo" href="#" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 text-xs font-mono font-semibold bg-slate-100 dark:bg-slate-800 border-2 border-slate-900 dark:border-slate-600 text-slate-800 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
            GitHub
          </a>
          <a id="hud-open" href="#" target="_blank" rel="noopener noreferrer" class="px-3.5 py-1.5 text-xs font-mono font-bold bg-indigo-600 border-2 border-slate-900 dark:border-indigo-300 text-white hover:bg-indigo-500 shadow-[2px_2px_0px_0px_rgba(15,23,42,0.9)] dark:shadow-[2px_2px_0px_0px_rgba(165,180,252,0.5)] transition">
            OPEN
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/apps.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
