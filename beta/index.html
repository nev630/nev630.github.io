<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>nev630 Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: {
              light: '#ffffff',
              dark: '#111827',
            },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased select-none">
  <!-- Fullscreen Three.js 3D Canvas -->
  <canvas id="portal-3d" class="fixed inset-0 w-full h-full block touch-none"></canvas>

  <!-- Top Category Filter Overlay -->
  <div class="fixed top-3 left-0 right-0 z-20 px-4 pointer-events-none">
    <div class="max-w-3xl mx-auto px-3.5 py-2 rounded-2xl bg-white/75 dark:bg-slate-900/75 backdrop-blur-md border border-slate-200/80 dark:border-slate-800/90 shadow-sm flex items-center justify-between gap-3 pointer-events-auto">
      <div id="category-tabs" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5"></div>
      <div class="text-xs text-slate-500 dark:text-slate-400 shrink-0">
        Apps <span id="app-count" class="font-semibold text-indigo-600 dark:text-indigo-400">0개</span>
      </div>
    </div>
  </div>

  <!-- Bottom Selected App HUD -->
  <div id="hud-wrapper" class="fixed bottom-5 left-0 right-0 z-20 px-4 pointer-events-none">
    <div class="max-w-xl mx-auto p-4 rounded-2xl bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border border-slate-200/80 dark:border-slate-800/90 shadow-xl pointer-events-auto">
      <div class="flex items-start justify-between gap-3 mb-2">
        <div class="flex items-center gap-3 min-w-0">
          <div id="hud-icon" class="w-11 h-11 rounded-xl bg-indigo-50 dark:bg-indigo-950/70 flex items-center justify-center text-2xl shrink-0"></div>
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <span id="hud-category" class="text-[11px] font-semibold text-indigo-600 dark:text-indigo-400"></span>
              <span id="hud-status" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-500/10 text-emerald-600 dark:text-emerald-400"></span>
            </div>
            <h2 id="hud-title" class="text-base font-bold truncate"></h2>
          </div>
        </div>

        <button
          id="hud-pin"
          type="button"
          aria-label="즐겨찾기"
          class="w-8 h-8 rounded-lg flex items-center justify-center text-base transition shrink-0"
        ></button>
      </div>

      <p id="hud-desc" class="text-xs text-slate-600 dark:text-slate-400 line-clamp-2 mb-3"></p>

      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-1.5">
          <button id="prev-btn" type="button" aria-label="이전 앱" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold transition">◀</button>
          <span id="hud-index" class="text-[11px] font-medium text-slate-500 dark:text-slate-400 px-1">1 / 1</span>
          <button id="next-btn" type="button" aria-label="다음 앱" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold transition">▶</button>
        </div>

        <div class="flex items-center gap-1.5">
          <a id="hud-repo" href="#" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
            GitHub
          </a>
          <a id="hud-open" href="#" target="_blank" rel="noopener noreferrer" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white hover:bg-indigo-500 transition shadow-sm">
            열기 ↗
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/apps.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
